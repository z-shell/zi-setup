---
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate strict annotated semantic tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '${tag}' is not a strict semantic version (expected vX.Y.Z)."
            exit 1
          fi

          tag_ref="refs/tags/${tag}"
          tag_type="$(git cat-file -t "$tag_ref" 2>/dev/null || true)"
          if [[ "$tag_type" != "tag" ]]; then
            echo "::error::Tag '${tag}' must be an annotated tag."
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "$tag_ref")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "${GITHUB_SHA}" || "$head_commit" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag '${tag}' (${tag_commit}) and HEAD (${head_commit}) must both resolve to event commit '${GITHUB_SHA}'."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Verify module files
        run: |
          go mod tidy -diff
          go mod verify

      - name: Verify formatting and whitespace
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' '::error::These files are not gofmt-clean:' "$unformatted"
            exit 1
          fi
          git diff --check

      - name: Verify release scripts
        run: |
          bash -n scripts/package-release.sh
          bash -n scripts/test-package-release.sh

      - name: Run vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -count=1 ./...

      - name: Run race tests
        run: go test -race -count=1 ./...

  codeql:
    name: CodeQL SAST Analysis
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          build-mode: autobuild
          languages: go

      - name: Analyze Go SAST
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: /language:go

  package:
    name: Package release distributions
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Build and package distributions (Windows requires sh on PATH)
        run: |
          ./scripts/package-release.sh "${GITHUB_REF_NAME}" dist

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Attest build provenance
    needs: [validate, codeql, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Attest archives and checksum manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  publish:
    name: Publish GitHub release
    needs: [validate, codeql, package, attest]
    if: github.repository == 'z-shell/zi-setup'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; uploading only missing assets."
            existing_assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            for asset in dist/*; do
              name="${asset##*/}"
              if grep -Fxq "$name" <<<"$existing_assets"; then
                echo "Asset ${name} already exists; leaving it unchanged."
              else
                gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "zi-setup ${tag}" \
              --notes "Windows distributions require a POSIX sh on PATH, such as Git Bash or MSYS2, to execute the setup engine." \
              --generate-notes
          fi
